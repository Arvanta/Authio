[package]
name = "authio"
version = "1.0.0"
description = "Authio — tiny, fast, secure open-source 2FA authenticator"
authors = ["Arvanta"]
license = "MIT"
edition = "2021"

[lib]
name = "authio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.11"
argon2 = "0.6"
scrypt = "0.12"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
data-encoding = "2"
base64 = "0.23"
getrandom = "0.3"
zeroize = { version = "1", features = ["serde"] }
keyring = { version = "3", default-features = false, features = ["windows-native"] }
rqrr = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
