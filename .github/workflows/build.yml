name: Build Windows

on:
  push:
    tags: ["v*"]   # build runs ONLY on version tags (no per-push builds)
  workflow_dispatch:

permissions:
  contents: write # needed to publish GitHub Releases on tags

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check & bundle frontend
        run: npm run build

      - name: Test Rust core (RFC 4226/6238 vectors, AES-GCM, Argon2id, scrypt, importers)
        run: cargo test
        working-directory: src-tauri

      - name: Build Tauri app (NSIS installer)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseDraft: false

      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path src-tauri\target\release\authio.exe -DestinationPath authio-$((Get-Date -Format yyyyMMdd))-windows-portable.zip -Force
          Rename-Item authio-*-windows-portable.zip authio-windows-portable.zip

      - name: Compute SHA-256 checksums (installer + portable zip)
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe
          $files += Get-Item authio-windows-portable.zip
          foreach ($f in $files) {
            $h = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLower()
            "$h  $($f.Name)" | Out-File -Encoding ascii -NoNewline "$($f.FullName).sha256"
          }

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: authio-windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: authio-windows-portable
          path: authio-windows-portable.zip

      - name: Attach portable zip, installer + checksums to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sha256
            authio-windows-portable.zip
            authio-windows-portable.zip.sha256
